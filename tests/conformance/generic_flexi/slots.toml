# Conformance scenarios: Generic Flexi, the parameters of a slot (trigger types, MIDI channel,
# resolution, knob modes, sending the value to the device). Fixture: tests/conformance/FIXTURE.md;
# setup: tests/conformance/generic_flexi/CONFORMANCE.md.

controller = "Generic Flexi"
manual = "Generic-Tools-Protocols/Generic-Flexi.md#parameters-for-each-slot"
# More than the 400 ms in which Flexi does not send a value back after it handled a command
settle_ms = 600

require = { "/track/1/name" = "Synth", "/track/8/exists" = "1" }

setup = [
  { osc = "/stop | /track/bank/page/- | /track/1/select 1", note = "first track page, track Synth" },
]

# The mapping, written to the file of the Filename setting before the restart (see
# CONFORMANCE.md). Channels are 1-16 (or "all"), layers 1-10 (or "all"). CC 0-31 with the
# layer "all" are left out except in the scenario of candidate M: there they are handled as
# 14 bit (doc/UPSTREAM_CANDIDATES.md).
[mapping]
slots = [
  { type = "cc", number = 70, command = "Track 1: Set Volume", note = "absolute knob" },
  { type = "cc", number = 71, command = "Track 2: Set Volume", knob_mode = "relative_twos_complement" },
  { type = "cc", number = 72, command = "Track 3: Set Volume", knob_mode = "relative_signed_bit" },
  { type = "cc", number = 73, command = "Track 4: Set Volume", knob_mode = "relative_signed_bit_2" },
  { type = "cc", number = 74, command = "Track 5: Set Volume", knob_mode = "relative_offset_binary" },
  { type = "cc", number = 75, command = "Track 5: Set Mute", knob_mode = "absolute_toggle" },
  { type = "note", number = 60, command = "Track 3: Toggle Mute" },
  { type = "pc", number = 5, command = "Track 4: Toggle Solo" },
  { type = "pitchbend", command = "Track 6: Set Panning" },
  { type = "mmc", number = 2, channel = 1, command = "Transport: Play", note = "MMC device ID 0 = channel 1" },
  { type = "cc", number = 2, command = "Track 7: Set Volume", high_res = true, note = "14 bit: CC 2 (MSB) and CC 34 (LSB)" },
  { type = "cc", number = 3, layer = "all", command = "Track 8: Set Volume", note = "candidate M" },
  { type = "cc", number = 3, layer = "all", command = "Track 8: Set Panning", note = "candidate M" },
  { type = "cc", number = 4, command = "Track 6: Set Volume", note = "layer 1: the control for candidate M" },
  { type = "cc", number = 4, command = "Track 7: Set Panning", note = "layer 1: the control for candidate M" },
  { type = "cc", number = 76, channel = "all", command = "Track 2: Toggle Mute" },
  { type = "cc", number = 77, command = "Track 1: Toggle Mute", send_value = true },
  { type = "cc", number = 78, command = "Track 1: Select", send_value = true, send_value_when_received = true },
]

[[known_difference]]
match = "leds B0 77"
reason = "The startup slot of the runner (master volume on CC 119, FLEXI_STARTUP_SLOT): the same in both, listed in case a run starts with another master volume"

[[scenario]]
id = "flexi.slot.cc-absolute"
bullet = "Type: MIDI status type, which triggers the function: CC ... Knob Mode: Absolute."
before = [{ osc = "/track/1/volume 100" }]
steps = [{ midi = "B0 46 00", note = "CC 70 = 0" }]
expect.bitwig = { "/track/1/volume" = "0" }

[[scenario]]
id = "flexi.slot.relative-twos-complement"
bullet = "Knob Mode: The encoding of the value sent by a knob: Relative: Twos Complement (1-64 increment, 127-65 decrement)."
before = [{ osc = "/track/2/volume 50" }]
steps = [
  { midi = "B0 47 05", note = "+5" },
  { midi = "B0 47 7D", note = "-3" },
]

[[scenario]]
id = "flexi.slot.relative-signed-bit"
bullet = "Knob Mode: Relative: Signed Bit (65-127 increment, 1-63 decrement)."
before = [{ osc = "/track/3/volume 50" }]
steps = [
  { midi = "B0 48 45", note = "+5" },
  { midi = "B0 48 03", note = "-3" },
]

[[scenario]]
id = "flexi.slot.relative-signed-bit-2"
bullet = "Knob Mode: Relative: Signed Bit 2 (1-63 increment, 65-127 decrement)."
before = [{ osc = "/track/4/volume 50" }]
steps = [
  { midi = "B0 49 05", note = "+5" },
  { midi = "B0 49 43", note = "-3" },
]

[[scenario]]
id = "flexi.slot.relative-offset-binary"
bullet = "Knob Mode: Relative: Offset Binary (65-127 increment, 63-0 decrement)."
before = [{ osc = "/track/5/volume 50" }]
steps = [
  { midi = "B0 4A 45", note = "+5" },
  { midi = "B0 4A 3D", note = "-3" },
]

[[scenario]]
id = "flexi.slot.absolute-toggle"
bullet = "Knob Mode: Absolute (toggle button: 1st press > 0, 2nd press = 0)."
before = [{ osc = "/track/5/mute 0" }]
# A toggle button sends one message per press and none on release: every message is a press
# (AbstractHandler.isButtonPressed), "Set Mute" takes its value
steps = [{ midi = "B0 4B 7F", note = "1st press" }]
expect.bitwig = { "/track/5/mute" = "1" }

[[scenario]]
id = "flexi.slot.absolute-toggle-second"
bullet = "Knob Mode: Absolute (toggle button: 1st press > 0, 2nd press = 0)."
steps = [{ midi = "B0 4B 00", note = "2nd press" }]
expect.bitwig = { "/track/5/mute" = "0" }

[[scenario]]
id = "flexi.slot.note"
bullet = "Type: ... a note. Number: The ... note ... number, which should trigger the function."
before = [{ osc = "/track/3/mute 0" }]
steps = [
  { midi = "90 3C 7F", note = "C4 on" },
  { midi = "80 3C 00", note = "C4 off" },
]
expect.bitwig = { "/track/3/mute" = "1" }

[[scenario]]
id = "flexi.slot.program-change"
bullet = "Type: ... program change command. Number: The ... Program change number."
before = [{ osc = "/track/3/mute 0 | /track/4/solo 0" }]
steps = [{ midi = "C0 05", note = "program 6 (5)" }]
expect.bitwig = { "/track/4/solo" = "1" }

[[scenario]]
id = "flexi.slot.pitchbend"
bullet = "Type: ... pitchbend. Resolution: High resolution of 14-bit is available for pitchbend (always)."
before = [{ osc = "/track/4/solo 0 | /track/6/pan 64" }]
steps = [{ midi = "E0 00 00", note = "pitchbend minimum" }]
expect.bitwig = { "/track/6/pan" = "0" }

[[scenario]]
id = "flexi.slot.mmc"
bullet = "You should see the transmitted MIDI command (CC, note, Program Change, Pitchbend or MMC)."
before = [{ osc = "/stop" }]
steps = [{ midi = "F0 7F 00 06 02 F7", note = "MMC Play, device ID 0" }]
expect.bitwig = { "/play" = "1" }

[[scenario]]
id = "flexi.slot.cc-14-bit"
bullet = "Resolution: High resolution of 14-bit (16384 values instead of 128) is available for ... CC messages below 32."
before = [{ osc = "/stop | /track/7/volume 100" }]
steps = [
  { midi = "B0 02 00", note = "MSB 0" },
  { midi = "B0 22 00", note = "LSB 0" },
]
expect.bitwig = { "/track/7/volume" = "0" }

[[scenario]]
id = "flexi.slot.candidate-m-all-layers"
bullet = "Functions Layer: Assigns the function to one of 10 layers (All: always). Two 7-bit slots on CC 3 with the layer All."
before = [{ osc = "/track/8/volume 0 | /track/8/pan 0" }]
steps = [{ midi = "B0 03 64", note = "CC 3 = 100" }]
# Candidate M of doc/UPSTREAM_CANDIDATES.md: Java (and the port, which keeps it) handles both
# slots as 14 bit and only the last one gets the value, the volume of track 8 stays 0. With the
# fix both change: then replace this expectation with the one of the control scenario.
expect.bitwig = { "/track/8/volume" = "0" }

[[scenario]]
id = "flexi.slot.candidate-m-control"
bullet = "Functions Layer: the same with the layer 1: both slots on CC 4 get the value."
before = [{ osc = "/track/6/volume 0 | /track/7/pan 0" }]
steps = [{ midi = "B0 04 00", note = "CC 4 = 0" }, { midi = "B0 04 64", note = "CC 4 = 100" }]

[[scenario]]
id = "flexi.slot.channel-all"
bullet = "Midi Channel: The MIDI channel on which to receive the command. Can also be set to All to accept the command on all MIDI channels."
before = [{ osc = "/track/2/mute 0" }]
steps = [{ midi = "B5 4C 7F", note = "CC 76 on channel 6" }, { midi = "B5 4C 00" }]
expect.bitwig = { "/track/2/mute" = "1" }

[[scenario]]
id = "flexi.slot.send-value"
bullet = "Send value to device: Enable if value changes of the assigned function should be reflected back to the controller."
before = [{ osc = "/track/2/mute 0 | /track/1/mute 0" }]
steps = [{ osc = "/track/1/mute 1", note = "mute in Bitwig, not from the controller" }]
expect.leds = { "B0 4D" = "7F" }

[[scenario]]
id = "flexi.slot.send-value-when-received"
bullet = "Send value to device when received: Sends back the received value to the controller."
before = [{ osc = "/track/1/mute 0 | /track/2/select 1" }]
steps = [
  { midi = "B0 4E 7F", note = "press" },
  { midi = "B0 4E 00", note = "release" },
]
expect.bitwig = { "/track/1/selected" = "1" }
