# Conformance scenarios: Arturia Beatstep, Session Mode (pads: see track.toml).
# Fixture: tests/conformance/FIXTURE.md (the launcher clips in slot 1 of Synth and Drums);
# setup: tests/conformance/beatstep/CONFORMANCE.md.

controller = "Arturia Beatstep"
manual = "Arturia/Arturia-Beatstep.md#session-mode"
settle_ms = 400

require = { "/track/1/name" = "Synth" }

setup = [
  { osc = "/stop | /track/bank/page/- | /track/1/select 1" },
  { midi = "90 07 7F | 92 31 7F | 82 31 00 | 90 07 00", note = "Shift + Pad 6: Session Mode" },
]

[[scenario]]
id = "bs.session.leds"
bullet = "Session Mode: Pad 1-8 and 15-16 are blue, Pad 9-14 off."
steps = [{ wait_ms = 100, note = "the LEDs of the setup" }]
expect.leds = { "F0 00 20 6B 7F 42 02 00 10 70" = "10", "F0 00 20 6B 7F 42 02 00 10 78" = "00", "F0 00 20 6B 7F 42 02 00 10 7F" = "10" }

[[scenario]]
id = "bs.session.launch"
bullet = "Pad 1-8: Start the scene 1-8"
before = [{ osc = "/stop" }]
steps = [{ midi = "92 2C 7F | 82 2C 00", note = "Pad 1: launch scene 1", wait_ms = 1500 }]
expect.bitwig = { "/play" = "1" }
