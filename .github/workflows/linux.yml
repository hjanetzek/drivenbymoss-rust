# CI on Linux: lints, then everything ci/linux.sh builds and tests (the crate with the replays of
# recorded Bitwig sessions, the C++ wrapper, dbm-nihost, the Reaper and the Bitwig extension).
name: Linux

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The Bitwig extension uses the Foreign Function & Memory API of JDK 25
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libasound2-dev shellcheck
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # Only the own scripts, not the third-party ones in backends/reaper/libraries
      - name: Shellcheck
        run: git ls-files '*.sh' ':!backends/reaper/libraries/**' | xargs shellcheck -S warning
      - name: Build and test
        run: ci/linux.sh
