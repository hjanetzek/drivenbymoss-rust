[package]
name = "drivenbymoss"
version = "26.1.0"
edition = "2021"
description = "Rust port of DrivenByMoss4Reaper: support for hardware controllers in Reaper"
license = "LGPL-3.0-only"
authors = ["Jürgen Moßgraber (original Java implementation)"]

[lib]
name = "drivenbymoss"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["lua"]
# Controllers written in Lua (doc/LUA_PLAN.md): Lua 5.4, built from its C source by mlua.
lua = ["dep:mlua"]

[dependencies]
mlua = { version = "0.12", features = ["lua54", "vendored"], optional = true }

[profile.release]
lto = true

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }
