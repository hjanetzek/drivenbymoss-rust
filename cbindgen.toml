# Configuration for generating include/drivenbymoss.h from src/ffi.rs (see build.rs)
language = "C"
include_guard = "DRIVENBYMOSS_H"
cpp_compat = true
documentation = true
documentation_style = "c99"
style = "both"
usize_is_size_t = true
sys_includes = ["stdint.h", "stddef.h"]
no_includes = true
autogen_warning = "/* Generated by cbindgen from src/ffi.rs - do not edit, run 'cargo build' instead. */"
header = """/*
 * Written by Jürgen Moßgraber - mossgrabers.de
 * (c) 2017-2026
 * Licensed under LGPLv3 - http://www.gnu.org/licenses/lgpl-3.0.txt
 *
 * C interface of DrivenByMoss (Rust). Hosts (DAW extensions, Python, Java, ...) create an
 * instance with dbm_create, feed it with model data (dbm_update_model) and MIDI
 * (dbm_on_midi_event) and receive commands and MIDI output through the DbmCallbacks table.
 *
 * Rules:
 * - All strings are NUL terminated UTF-8. Null pointers are treated as empty strings.
 * - Strings returned by the library are released with dbm_free_string (unless documented
 *   otherwise, e.g. dbm_version).
 * - Strings and buffers passed in either direction are only valid during the call.
 * - All calls on one instance are serialized internally; different instances are independent.
 *   Calling dbm_* functions of the same instance from within a callback deadlocks.
 * - Callbacks are called on the thread which called into the library or on the internal timer
 *   thread (unless DBM_FLAG_HOST_TICK is used, then only on the calling threads).
 * - Panics never cross the boundary.
 */"""

[export]
include = ["DbmCallbacks", "DbmAddDevice"]

[export.rename]

[parse]
parse_deps = false

[fn]
args = "auto"
